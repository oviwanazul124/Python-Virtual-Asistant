# config.ini
# Basic Configuration for the Virtual Assistant
[baseConfig]
language = en

# Config wikipedia module
[wikipedia]
enabled = False
languageW = en

# Config hello module
[hello]
enabled = False

# Config openApp module
[openApp]
enabled = False
whitelist = False
whilelistCustomPath = False
wCPath =

# Config openWeb module
[openWeb]
enabled = False

# Config shutdown module
[shutdown]
enabled = False

# Config for the weather module
[weather]

# This option will use Windows API to check your current position and use it 
useYourLocation = True

# Implemented: Open-Meteo 
weatherChoose = 

